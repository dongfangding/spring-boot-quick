server:
  port: 8080
  tomcat:
    max-connections: 10000
    threads:
      max: 600
      min-spare: 50
    processor-cache: 300
  # 服务优雅下线
  shutdown: graceful
  servlet:
    context-path: /boot-quick

spring:
  messages:
    basename: i18n/messages,i18n/biz_messages
    encoding: UTF-8
  lifecycle:
    timeout-per-shutdown-phase: 60s
  profiles:
    active: dev
  application:
    name: spring-boot-quick
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 10MB
  redis:
    redisson:
      file: classpath:redisson.yml
  data:
    redis:
      host: localhost
      port: 6379
      database: 1
      password: Aa&123456
  sql:
    init:
      mode: always
shardingsphere:
  mode:
    type: Memory
  props:
    sql.show: true
  enabled: true
  datasource:
    master:
      type: com.alibaba.druid.pool.DruidDataSource
      driver-class-name: com.mysql.cj.jdbc.Driver
      initial-size: 10
      asyncInit: true
      max-active: 200
      min-idle: 10
      keep-alive: true
      max-wait: 60000
      use-unfair-lock: true
      time-between-eviction-runs-millis: 59000
      min-evictable-idle-time-millis: 590000
      validation-query: SELECT 1
      test-while-idle: true
      test-on-borrow: true
      test-on-return: false
      poolPreparedStatements: false
      max-open-prepared-statements: 20
    druid:
      filter:
        stat:
          enabled: true
          log-slow-sql: true
          slow-sql-millis: 3000
        wall:
          enabled: true
          db-type: mysql
      stat-view-servlet:
        enabled: true
        url-pattern: /druid/*
        reset-enable: true
        login-username: admin
        login-password: 123456
        allow:
  rules:
    sharding:
      default-data-source-name: master
      sharding-algorithms:
        hashmod10-algorithm:
          type: HASH_MOD
          props:
            sharding-count: '10'
        suffix-sharding-algorithm:
          type: CLASS_BASED
          props:
            strategy: standard
            algorithmClassName: com.boot.common.sharding.config.SuffixFieldShardingAlgorithm
logging:
  level:
    root: info
    com.ddf.boot.common.log.AccessLogAspect: info

rocketmq:
  name-server: localhost:9876
  producer:
    group: dev-producer-group
    access-key: dev
    secret-key: dev
    enableMsgTrace: true
  consumer:
    group: dev-consumer-group
    access-key: dev
    secret-key: dev
    enableMsgTrace: true

customizer:
  infra:
    ids:
      zkAddress: localhost:2181
      port: 2181
      segmentEnable: false
    distributed:
      lock:
        redis:
          enable: true
        zookeeper:
          enable: true
    redis:
      extra-multi:
        enable: false
        # 多redis数据源配置
        map:
          user:
            host: localhost
            port: 6379
            database: 1
            password:
    mqtt:
      config:
        enable: true
        connectionUrls:
          - protocol: mqtt_tcp
            url: tcp://localhost:1883
        client:
          clientIdPrefix: boot-quick
          username: system
          password: Aa&123456
    authentication:
      secret: happygamegamehappygamehappyhappy
      expired-minute: 10080
      ignores:
        - /auth/sendRegisterSmsCode
        - /auth/registry
        - /auth/login
        - /common/generateCaptcha
        - /common/checkCaptcha
        - /common/sendSmsCode
    global-properties:
      # worker Id can't be greater than 31 or less than 0
      snowflakeWorkerId: 1
      # dataCenterId Id can't be greater than 31 or less than 0
      snowflakeDataCenterId: 1
      # 过滤将异常堆栈信息输出打前端接口返回值的环境
      ignoreErrorTraceProfile:
        - pre
        - prod
      # 异常模式， true标识使用异常时保证http状态码为200，使用返回数据标识具体异常
      exception200: true

mybatis:
  mapper-locations: classpath:/mapper/*.xml,classpath:/mapper/ext/*.xml
  configuration:
    map-underscore-to-camel-case: true
    default-fetch-size: 100
    default-statement-timeout: 30


server:
  port: 8080
  tomcat:
    max-connections: 10000
    threads:
      max: 600
      min-spare: 50
    processor-cache: 300
  # 服务优雅下线
  shutdown: graceful
  servlet:
    context-path: /boot-quick

spring:
  messages:
    basename: i18n/messages,i18n/biz_messages
    encoding: UTF-8
  lifecycle:
    timeout-per-shutdown-phase: 60s
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 10MB
  profiles:
    active: dev
  application:
    name: spring-boot-quick
  data:
    redis:
      host: localhost
      port: 6379
      password: Aa&123456
      database: 1
  redis:
    redisson:
      file: classpath:redisson.yml
  sql:
    init:
      mode: always
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    druid:
      url: jdbc:mysql://${mysql_host}:3306/boot-quick?serverTimezone=Asia/Shanghai&zeroDateTimeBehavior=convertToNull&allowPublicKeyRetrieval=true
      username: root
      password: Aa&123456
      initial-size: 10
      asyncInit: true
      max-active: 200
      min-idle: 10
      keep-alive: true
      max-wait: 60000
      use-unfair-lock: true
      time-between-eviction-runs-millis: 59000
      min-evictable-idle-time-millis: 590000
      validation-query: SELECT 1
      test-while-idle: true
      test-on-borrow: true
      test-on-return: false
      poolPreparedStatements: false
      max-open-prepared-statements: 20
      filter:
        stat:
          enabled: true
          log-slow-sql: true
          slow-sql-millis: 3000
        wall:
          enabled: true
          db-type: mysql
      stat-view-servlet:
        enabled: true
        url-pattern: /druid/*
        reset-enable: true
        login-username: admin
        login-password: Aa&123456
        allow:
logging:
  level:
    root: info

customizer:
  infra:
    distributed:
      lock:
        redis:
          enable: true
    redis:
      extra-multi:
        enable: false
        # 多redis数据源配置
        map:
          user:
            host: localhost
            port: 6379
            database: 1
            password:
    global-properties:
      # worker Id can't be greater than 31 or less than 0
      snowflakeWorkerId: 1
      # dataCenterId Id can't be greater than 31 or less than 0
      snowflakeDataCenterId: 1
      # 是否开启全局的日志打印详情（默认关闭， 先精准控制日志行为，线上排查问题时，可临时开启）
      globalLogPrintDetails: false
      # 要忽略的打印异常日志的异常完全类型, 不会打印error， 不影响打印info日志
      ignoreLogExceptionClassName:
        - com.ddf.boot.common.api.exception.BusinessException
        - com.ddf.boot.common.api.exception.AccessDeniedException
        - com.ddf.boot.common.api.exception.UnauthorizedException
        - org.springframework.http.converter.HttpMessageNotReadableException
        - org.springframework.security.access.AccessDeniedException
        - org.springframework.web.bind.MethodArgumentNotValidException
        - org.springframework.web.method.annotation.MethodArgumentTypeMismatchException
mybatis:
  mapper-locations: classpath:/mapper/*.xml,classpath:/mapper/ext/*.xml
  configuration:
    map-underscore-to-camel-case: true
    default-fetch-size: 100
    default-statement-timeout: 30

